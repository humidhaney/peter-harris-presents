<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Peter Harris Presents — Protected</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --navy: #1F3864;
    --accent: #2E75B6;
    --gold: #B8893A;
    --bg: #0E1F40;
    --text: #F4EFE6;
    --muted: rgba(244,239,230,0.65);
    --error: #E06A6A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: linear-gradient(135deg, #0E1F40 0%, #1F3864 60%, #2A4A7C 100%);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 18% 30%, rgba(184,137,58,0.18), transparent 45%),
      radial-gradient(circle at 82% 70%, rgba(46,117,182,0.20), transparent 50%);
    pointer-events: none; z-index: 0;
  }
  .gate {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    border-radius: 16px;
    padding: 48px 40px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: white;
  }
  p.intro {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.55;
  }
  label {
    display: block;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  input[type=password] {
    width: 100%;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 14px 16px;
    color: white;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.18s ease, background 0.18s ease;
  }
  input[type=password]:focus {
    border-color: var(--accent);
    background: rgba(0,0,0,0.35);
  }
  button {
    width: 100%;
    margin-top: 16px;
    background: linear-gradient(90deg, var(--accent), #5891C9);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(46,117,182,0.35); }
  button:disabled { opacity: 0.5; cursor: wait; transform: none; }
  .error {
    margin-top: 14px;
    color: var(--error);
    font-size: 13px;
    min-height: 18px;
  }
  .footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .footer .brand { color: white; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
  <main class="gate" id="gate">
    <div class="eyebrow">Protected Page</div>
    <h1>Peter Harris Presents</h1>
    <p class="intro">Jazz Album Series — Funding Project Plan. Enter the access password to view.</p>
    <form id="form" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="off" autofocus required />
      <button id="go" type="submit">Unlock</button>
      <div class="error" id="err" role="alert" aria-live="polite"></div>
    </form>
    <div class="footer"><span class="brand">PETER HARRIS PRESENTS</span></div>
  </main>

  const ITER = 250000;

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: ITER, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock(password) {
    const key = await deriveKey(password);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(IV) },
      key,
      b64ToBytes(CT)
    );
    return new TextDecoder().decode(plain);
  }

  const form = document.getElementById("form");
  const pwIn = document.getElementById("pw");
  const errEl = document.getElementById("err");
  const goBtn = document.getElementById("go");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.textContent = "";
    goBtn.disabled = true;
    goBtn.textContent = "Unlocking…";
    try {
      const html = await unlock(pwIn.value);
      // Replace document with the decrypted HTML.
      // Use blob + iframe? No — simplest is open/write/close + history replace.
      document.open();
      document.write(html);
      document.close();
      // Do NOT change the URL — the page is already at index.html
    } catch (ex) {
      errEl.textContent = "Incorrect password. Try again.";
      pwIn.value = "";
      pwIn.focus();
      goBtn.disabled = false;
      goBtn.textContent = "Unlock";
    }
  });
})();
